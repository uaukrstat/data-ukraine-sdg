SDG_GOAL: 3 Healthy lives and well-being
SDG_TARGET: 3.2 Reducing maternal mortality rates
SDG_INDICATOR: 3.2.1 Maternal mortality rate, per 100,000 live-births
UNIT_MEASURE: per 100,000 live-births
CONTACT_ORGANISATION: State Statistics Service of Ukraine (SSSU)
REC_USE_LIM: '2015–2021: Excluding the temporarily occupied territory of the Autonomous Republic of Crimea, the city of Sevastopol and part of the temporarily occupied territories in Donetsk and Luhansk regions. <br> 2022–2025: Given the situation that has developed due to the military aggression of the russian federation against Ukraine, the formation of official state statistical information on mortality and birth rates has been suspended starting from 2022 due to the impossibility of obtaining full administrative data, which are the source of the formation of relevant statistical information. The formation and dissemination of the specified statistical information will be resumed after the State Statistics Authorities receive the necessary administrative data in full (for each administrative-territorial unit) and the termination of the legal regime of martial law in Ukraine.'
