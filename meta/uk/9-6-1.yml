REC_USE_LIM: 'Дані розробляються з 2024 року. <br> 2024–2025 роки: У розрахунках використано дані щодо кількості домогосподарств відповідно до Статистичного збірника "Соціально-демографічні характеристики домогосподарств України у 2021 році". Без даних тимчасово окупованих територій згідно з наказом Міністерства розвитку громад та територій України від 28.02.2025 № 376, зареєстрованим в Міністерстві юстиції України 11 березня 2025 року за № 380/43786. Після оновлення даних по домогосподарствах розрахунки буде оновлено.'
